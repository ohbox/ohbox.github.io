<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1440" viewBox="0 0 1800 1440" role="img" aria-labelledby="title desc">
<title id="title">GoPublics branching backend information architecture</title>
<desc id="desc">A branching system map. Sign-up and sign-in lead to one shared backend, which branches into Website and Account. Website routes include Dashboard, Content Work, Website Management, Member Management, Customer Support, Tags, and Explore. Content Work expands into manage, categorize, write, and publish. Account routes expand into Personal Info, four settings groups, Feedback's Problem messages and Reply records, and a separate sidebar utility for Plans and upgrade.</desc>
<defs>
